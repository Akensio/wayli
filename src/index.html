<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f3">
<script>/* before the first paint: the menus' theme and the map's ground colour from the saved settings, so a reload never flashes */
(function(){try{var l=localStorage.getItem('wayli-lang')||'he';document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';var s=JSON.parse(localStorage.getItem('wayli-settings')||'{}');var sys=matchMedia('(prefers-color-scheme: dark)').matches;var th=s.theme||'system';if(th!=='system')document.documentElement.dataset.theme=th;var map=s.map||'system';var dark=map==='dark'||(map==='system'&&sys);var neutral=s.mapTint==='neutral';var land=dark?(neutral?'#191c21':'#171c1b'):(neutral?'#f3f2ee':'#f2f4f3');document.documentElement.style.setProperty('--map-land',land);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=land;}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wayli">
<title>Wayli</title>
<meta name="description" content="תחבורה ציבורית בישראל: אוטובוס, רכבת, רכבת קלה ואופניים, מתוכנן בטלפון שלך.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mainMap"></div>

<div id="topbar-root"></div>
<div id="drawer-root" style="display:contents"></div>
<div class="floating">
  <div class="status" id="status" hidden><span id="statusText">טוען…</span><div class="bar" id="statusBar"><div></div></div></div>
  <span class="offline" id="offline" hidden data-t="offline">לא מקוון</span>
  <div id="resume-root" style="display:contents"></div>
</div>
<div class="livenote" id="liveNote"></div>
<div class="pickbar" id="pickbar" hidden>
  <div class="row"><span class="muted" id="pickHint" data-t="pickHint">הקישו על המפה על המקום הרצוי</span><span class="spacer" style="flex:1"></span><button type="button" class="ghost" id="pickCancel" data-t="cancel">ביטול</button></div>
</div>

<div class="sheet" id="sheet" data-state="peek">
  <div class="handle" id="sheetHandle"><span></span></div>
  <div class="pagehead"><button type="button" class="iconbtn flat" id="pageBack" aria-label="חזרה"><svg class="i chev" aria-hidden="true"><use href="#i-back"/></svg></button><h2 id="pageTitle"></h2></div>
  <div class="sheet-body" id="sheetBody">

  <section class="screen" id="screen-plan"></section>

  <section class="screen" id="screen-nearby" hidden></section>

  <section class="screen" id="screen-saved" hidden></section>

  <section class="screen" id="screen-more" hidden></section>

  <div class="detail" id="detail" hidden></div>

  <div class="detail" id="stopDetail" hidden></div>

  <div class="detail" id="tripDetail" hidden></div>

  <div class="detail" id="lineDetail" hidden></div>

  <div class="detail" id="chooser" hidden></div>

  <div class="detail follow" id="follow" hidden></div>

  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js" crossorigin=""></script>
<script type="module" src="./main.ts"></script>
</body>
</html>
