<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f3">
<script>/* before the first paint: the menus' theme and the map's ground colour from the saved settings, so a reload never flashes */
(function(){try{var l=localStorage.getItem('wayli-lang')||'he';document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';var s=JSON.parse(localStorage.getItem('wayli-settings')||'{}');var sys=matchMedia('(prefers-color-scheme: dark)').matches;var th=s.theme||'system';if(th!=='system')document.documentElement.dataset.theme=th;var map=s.map||'system';var dark=map==='dark'||(map==='system'&&sys);var neutral=s.mapTint==='neutral';var land=dark?(neutral?'#191c21':'#171c1b'):(neutral?'#f3f2ee':'#f2f4f3');document.documentElement.style.setProperty('--map-land',land);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=land;}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wayli">
<title>Wayli</title>
<meta name="description" content="תחבורה ציבורית בישראל: אוטובוס, רכבת, רכבת קלה ואופניים, מתוכנן בטלפון שלך.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mainMap"></div>

<div id="topbar-root"></div>
<div id="drawer-root" style="display:contents"></div>
<div id="floating-root" style="display:contents"></div>
<div id="livenote-root" style="display:contents"></div>
<div id="pickbar-root" style="display:contents"></div>

<div id="sheet-root" style="display:contents"></div>

<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js" crossorigin=""></script>
<script type="module" src="./main.ts"></script>
</body>
</html>
