<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f3">
<script>/* before the first paint: the menus' theme and the map's ground colour from the saved settings, so a reload never flashes */
(function(){try{var l=localStorage.getItem('wayli-lang')||'he';document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';var s=JSON.parse(localStorage.getItem('wayli-settings')||'{}');var sys=matchMedia('(prefers-color-scheme: dark)').matches;var th=s.theme||'system';if(th!=='system')document.documentElement.dataset.theme=th;var map=s.map||'system';var dark=map==='dark'||(map==='system'&&sys);var neutral=s.mapTint==='neutral';var land=dark?(neutral?'#191c21':'#171c1b'):(neutral?'#f3f2ee':'#f2f4f3');document.documentElement.style.setProperty('--map-land',land);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=land;}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wayli">
<title>Wayli</title>
<meta name="description" content="תחבורה ציבורית בישראל: אוטובוס, רכבת, רכבת קלה ואופניים, מתוכנן בטלפון שלך.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mainMap"></div>

<div id="topbar-root"></div>
<div id="drawer-root" style="display:contents"></div>
<div id="settings-root" style="display:contents"></div>
<div id="floating-root" style="display:contents"></div>
<div id="livenote-root" style="display:contents"></div>
<div id="pickbar-root" style="display:contents"></div>

<div id="sheet-root" style="display:contents"></div>
<div id="menus-root" style="display:contents"></div>

<div class="toast" id="toast" hidden></div>
<script>/* the safety net: if the app has not started after 12 s (an error, a file that would not load), say so and offer a
way out instead of a blank page; the error, if any, is shown so it can be reported */
(function(){var err='';function note(e){if(!err)err=String((e&&(e.message||e.reason&&e.reason.message))||e&&e.reason||e||'');}
addEventListener('error',function(e){note(e.error||e.message||(e.target&&e.target.src?'could not load '+e.target.src:''));},true);
addEventListener('unhandledrejection',note);
setTimeout(function(){if(document.body.classList.contains('booted'))return;var he=(document.documentElement.lang||'he')==='he';
var d=document.createElement('div');d.id='bootFail';d.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px system-ui,sans-serif;background:#f2f4f3;color:#17201d';
d.innerHTML='<b style="font-size:19px"></b><span></span><code style="font-size:12px;max-width:100%;word-break:break-all;color:#5b6663"></code><button style="font:inherit;padding:10px 22px;border-radius:22px;border:0;background:#0f766e;color:#fff"></button><button style="font:inherit;padding:10px 22px;border-radius:22px;border:1px solid #9aa5a1;background:none;color:inherit"></button>';
var c=d.children;c[0].textContent=he?'וויילי לא עלתה':'Wayli did not start';c[1].textContent=he?'אפשר לנסות שוב, או לנקות את הקבצים השמורים של האפליקציה (ההיסטוריה והמקומות השמורים נשארים).':'Try again, or clear the app\'s stored files (your history and saved places stay).';
c[2].textContent=err;c[3].textContent=he?'לנסות שוב':'Try again';c[4].textContent=he?'לנקות קבצים שמורים ולטעון':'Clear stored files and reload';
c[3].onclick=function(){location.reload();};
c[4].onclick=function(){var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));if(self.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));}catch(e){}Promise.all(p).then(function(){location.reload();},function(){location.reload();});};
document.body.appendChild(d);},12000);})();</script>
<script type="module" src="./main.ts"></script>
</body>
</html>
