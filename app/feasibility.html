<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayli routing test</title>
<meta name="description" content="Feasibility test: trip planning over the whole Israel timetable and street network, running in the phone's browser.">
<style>
  /* Layout: one column, cards for load status, the query, and results; orange accent from the project. */
  :root {
    --bg: #f4f5f2; --surface: #ffffff; --ink: #1b1f24; --ink-2: #5b6470; --line: #dde0da;
    --accent: #d14b1f; --accent-ink: #ffffff; --ok: #1f7a4d; --warn: #9a5b00; --chip: #eceee9; --bike: #1f5fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --surface: #1e2227; --ink: #e9eae6; --ink-2: #9aa2ab; --line: #2d3339;
      --accent: #e8663a; --accent-ink: #15181c; --ok: #5fc48c; --warn: #e0a84a; --chip: #262b31; --bike: #6ea8ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181c; --surface: #1e2227; --ink: #e9eae6; --ink-2: #9aa2ab; --line: #2d3339;
    --accent: #e8663a; --accent-ink: #15181c; --ok: #5fc48c; --warn: #e0a84a; --chip: #262b31; --bike: #6ea8ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
  input, select, button { font: inherit; }
  input[type=text], input[type=time], input[type=number], select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); }
  select { unicode-bidi: plaintext; }
  button { padding: 11px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; cursor: pointer; margin-top: 14px; }
  button.ghost { background: var(--chip); color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; min-width: 0; }
  #examples button { margin-top: 6px; padding: 8px 10px; font-weight: 500; font-size: 14px; }
  .seg { display: flex; gap: 6px; }
  .seg button { margin: 0; flex: 1; background: var(--chip); color: var(--ink); padding: 8px 10px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .stat { display: inline-block; background: var(--chip); border-radius: 6px; padding: 4px 10px; font-size: 13px; margin: 4px 6px 0 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  .journey { border-top: 1px solid var(--line); padding: 10px 0; }
  .journey:first-child { border-top: 0; }
  .journey h3 { margin: 0 0 6px; font-size: 15px; }
  .journey h3 small { color: var(--ink-2); font-weight: 400; }
  .leg { display: flex; gap: 10px; font-size: 14px; margin: 3px 0; }
  .leg .t { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 92px; }
  .leg > span:last-child { min-width: 0; }
  .line { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 6px; font-weight: 600; }
  .bike { color: var(--bike); font-weight: 600; }
  .name { unicode-bidi: plaintext; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .error { color: var(--warn); font-size: 14px; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wayli routing test</h1>
  <p class="sub">Trip planning over the whole Israel timetable and street network, running in this browser. Nothing is sent anywhere.</p>

  <div class="card" id="load">
    <div id="loadStatus">Loading the timetable…</div>
    <div id="loadStats"></div>
  </div>

  <div class="card">
    <div class="muted">Examples</div>
    <div class="row" id="examples">
      <button type="button" class="ghost" data-from="מרכזית המפרץ" data-to="מרכזית באר שבע" data-at="08:00">Haifa → Be'er Sheva</button>
      <button type="button" class="ghost" data-from="32.0720,34.8100" data-from-mode="bike" data-to="ת. מרכזית המפרץ" data-at="09:00">Givatayim by bike → Haifa</button>
      <button type="button" class="ghost" data-from="32.0720,34.8100" data-from-mode="bike" data-to="ת. מרכזית ירושלים" data-at="07:30">Givatayim by bike → Jerusalem</button>
      <button type="button" class="ghost" data-from="ת. רכבת תל אביב סבידור" data-to="ת. מרכזית אילת" data-at="06:00">Tel Aviv → Eilat</button>
    </div>
    <div class="row">
      <div>
        <label for="fromQ">From</label>
        <input type="text" id="fromQ" placeholder="stop, station or lat,lon" autocomplete="off" disabled>
        <select id="from" disabled></select>
        <div class="seg" id="fromMode"><button type="button" data-mode="walk" aria-pressed="true">Walk</button><button type="button" data-mode="bike" aria-pressed="false">Bike</button></div>
        <div class="hint">Access mode from a point</div>
      </div>
      <div>
        <label for="toQ">To</label>
        <input type="text" id="toQ" placeholder="stop, station or lat,lon" autocomplete="off" disabled>
        <select id="to" disabled></select>
        <div class="seg" id="toMode"><button type="button" data-mode="walk" aria-pressed="true">Walk</button><button type="button" data-mode="bike" aria-pressed="false">Bike</button></div>
        <div class="hint">Egress mode to a point</div>
      </div>
    </div>
    <div class="row">
      <div><label for="at">Leave at</label><input type="time" id="at" value="08:00" disabled></div>
      <div><label for="win">Window (minutes)</label><input type="number" id="win" value="60" min="0" max="240" step="15" disabled></div>
    </div>
    <div class="row">
      <button id="run" disabled>Plan trips</button>
      <button id="bench" class="ghost" disabled>Run 5× and time it</button>
    </div>
    <div class="error" id="formError" hidden></div>
  </div>

  <div class="card" id="result" hidden>
    <div class="muted" id="took">Planning took</div>
    <div class="big" id="ms"></div>
    <div class="muted" id="verdict"></div>
    <div id="bikeOnly"></div>
    <div id="journeys"></div>
  </div>

  <p class="muted">Goal: a correct plan in under one second on a phone. Device: <span id="ua"></span></p>
</div>

<script type="module">
import { parseTimetable, searchStops, plan, profile, fmtTime, routeLabel } from './raptor.js';
import { parseStreets, accessStops, route } from './streets.js';

const $ = (id) => document.getElementById(id);
$('ua').textContent = navigator.userAgent.replace(/Mozilla\/5\.0 /, '');
const params = new URLSearchParams(location.search);
const PRESET = { from: params.get('from') || '__FROM__', to: params.get('to') || '__TO__' };
const TT_URL = '__TT__' === '__' + 'TT__' ? 'timetable.bin.gz' : '__TT__';
const ST_URL = '__ST__' === '__' + 'ST__' ? 'streets.bin.gz' : '__ST__';
if (params.get('at')) $('at').value = params.get('at');
if (params.get('win')) $('win').value = params.get('win');
const MAX_ACCESS = { walk: 15 * 60, bike: 20 * 60 };

let tt = null, st = null;
const stats = [];
const stat = (label, value) => { stats.push(`<span class="stat">${label} <b>${value}</b></span>`); $('loadStats').innerHTML = stats.join(''); };

async function fetchContainer(url) {
  const t0 = performance.now();
  const res = await fetch(url);
  let buf, bytes;
  if (url.endsWith('.txt')) {
    // the artifact host serves text, not binaries: base64 of the gzip'd file
    const b64 = await res.text();
    bytes = b64.length;
    const bin = atob(b64.trim());
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    buf = u.buffer;
  } else {
    buf = await res.arrayBuffer();
    bytes = buf.byteLength;
  }
  const tFetch = performance.now() - t0;
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    buf = await new Response(stream).arrayBuffer();
  }
  return { buf, bytes, tFetch, tUnzip: performance.now() - t0 - tFetch };
}

async function loadAll() {
  const a = await fetchContainer(TT_URL);
  let t1 = performance.now();
  tt = parseTimetable(a.buf);
  stat('timetable', `${(a.bytes / 1e6).toFixed(1)} MB in ${(a.tFetch / 1000).toFixed(1)} s, unzip ${Math.round(a.tUnzip)} ms, parse ${Math.round(performance.now() - t1)} ms`);
  const c = tt.counts;
  $('loadStatus').innerHTML = `Timetable for <b>${tt.header.date.replace(/(\d{4})(\d\d)(\d\d)/, '$3.$2.$1')}</b>: ${c.trips.toLocaleString()} trips, ${c.events.toLocaleString()} stop times, ${c.stops.toLocaleString()} stops, ${c.footpaths.toLocaleString()} transfers${tt.header.streets ? ' (from the street network)' : ''}.`;
  for (const id of ['fromQ', 'toQ', 'from', 'to', 'at', 'win', 'run', 'bench']) $(id).disabled = false;
  fillPreset();
  try {
    const b = await fetchContainer(ST_URL);
    t1 = performance.now();
    st = parseStreets(b.buf);
    stat('streets', `${(b.bytes / 1e6).toFixed(1)} MB in ${(b.tFetch / 1000).toFixed(1)} s, unzip ${Math.round(b.tUnzip)} ms, parse ${Math.round(performance.now() - t1)} ms, ${st.M.toLocaleString()} nodes`);
    $('loadStatus').innerHTML += ' Street network loaded: points and bikes work.';
  } catch (e) {
    stat('streets', 'not loaded: ' + e.message);
  }
  const q = query(true);
  if (q) runQuery(q);
}

// ---- places: a search group (stop/station) or a point with a mode
function parsePoint(s) {
  const m = s.trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  return m ? { lat: Number(m[1]), lon: Number(m[2]) } : null;
}
function fillOptions(sel, hits) {
  sel.innerHTML = '';
  for (const g of hits) {
    const o = document.createElement('option');
    o.value = g.key;
    o.textContent = `${g.name}${g.city ? ' · ' + g.city : ''}${g.stops.length > 1 ? ` (${g.stops.length} platforms)` : ''}`;
    o.dataset.stops = g.stops.join(',');
    o.dataset.lat = g.lat; o.dataset.lon = g.lon;
    sel.appendChild(o);
  }
}
function wireSearch(inputId, selId) {
  $(inputId).addEventListener('input', () => {
    const q = $(inputId).value.trim();
    if (parsePoint(q)) { $(selId).innerHTML = '<option value="point">point on the map</option>'; return; }
    if (q.length < 2) return;
    fillOptions($(selId), searchStops(tt, q, 12));
  });
}
wireSearch('fromQ', 'from');
wireSearch('toQ', 'to');
for (const segId of ['fromMode', 'toMode']) {
  for (const b of $(segId).querySelectorAll('button')) b.addEventListener('click', () => {
    for (const o of $(segId).querySelectorAll('button')) o.setAttribute('aria-pressed', String(o === b));
  });
}
const modeOf = (segId) => $(segId).querySelector('[aria-pressed="true"]').dataset.mode;

function fillPreset() {
  for (const [q, inputId, selId] of [[PRESET.from, 'fromQ', 'from'], [PRESET.to, 'toQ', 'to']]) {
    if (!q || q.startsWith('__')) continue;
    $(inputId).value = q;
    if (parsePoint(q)) $(selId).innerHTML = '<option value="point">point on the map</option>';
    else fillOptions($(selId), searchStops(tt, q, 12));
  }
}

/** Resolve one side of the query into {places:[{stop,walk,mode}], point?, label} */
function resolve(inputId, selId, segId, what) {
  const text = $(inputId).value.trim();
  const pt = parsePoint(text);
  const mode = modeOf(segId);
  if (pt) {
    if (!st) throw new Error('Street network not loaded, so points cannot be used yet. Pick a stop instead.');
    const places = accessStops(st, tt.stopNode, pt.lat, pt.lon, mode, MAX_ACCESS[mode]);
    if (!places.length) throw new Error(`No stop within ${MAX_ACCESS[mode] / 60} min by ${mode} of the ${what} point.`);
    return { places, point: pt, mode, label: `${pt.lat.toFixed(4)}, ${pt.lon.toFixed(4)} (${mode})` };
  }
  const opt = $(selId).selectedOptions[0];
  if (!opt || !opt.dataset.stops) throw new Error(`Pick the ${what} stop first.`);
  const stops = opt.dataset.stops.split(',').map(Number);
  return { places: stops.map((s) => ({ stop: s, walk: 0 })), point: { lat: Number(opt.dataset.lat), lon: Number(opt.dataset.lon) }, mode: 'walk', label: opt.textContent };
}

function query(quiet) {
  $('formError').hidden = true;
  try {
    const [h, m] = $('at').value.split(':').map(Number);
    if (Number.isNaN(h)) throw new Error('Pick a departure time.');
    return { from: resolve('fromQ', 'from', 'fromMode', 'origin'), to: resolve('toQ', 'to', 'toMode', 'destination'),
             at: h * 3600 + m * 60, win: Math.max(0, Number($('win').value) || 0) * 60 };
  } catch (e) {
    if (!quiet) { $('formError').textContent = e.message; $('formError').hidden = false; }
    return null;
  }
}

function runQuery(q, times) {
  const t0 = performance.now();
  const r = profile(tt, q.from.places, q.to.places, q.at, q.at + q.win, { maxTransfers: 3 });
  let bikeOnly = null;
  if (st && q.from.point && q.to.point && (q.from.mode === 'bike' || q.to.mode === 'bike')) {
    bikeOnly = route(st, q.from.point.lat, q.from.point.lon, q.to.point.lat, q.to.point.lon, 'bike', 3 * 3600);
  }
  const ms = performance.now() - t0;
  render(q, r, bikeOnly, ms, times);
  return ms;
}

function render(q, r, bikeOnly, ms, times) {
  $('result').hidden = false;
  const shown = times ? times[times.length >> 1] : ms;
  $('took').textContent = times ? 'Planning took (median of 5)' : 'Planning took';
  $('ms').textContent = `${shown.toFixed(0)} ms`;
  $('ms').className = 'big ' + (shown < 1000 ? 'ok' : 'warn');
  $('verdict').textContent = `${q.from.label} → ${q.to.label} · window ${q.win / 60} min · ${r.candidates} departures tried, ${r.runs} runs, ${r.journeys.length} journeys` + (times ? ` · min ${Math.min(...times).toFixed(0)} ms, max ${Math.max(...times).toFixed(0)} ms` : '');
  $('bikeOnly').innerHTML = bikeOnly ? `<div class="journey"><h3><span class="bike">Bike all the way</span> · ${Math.round(bikeOnly.seconds / 60)} min · ${(bikeOnly.metres / 1000).toFixed(1)} km</h3></div>` : '';
  const box = $('journeys');
  box.innerHTML = '';
  if (!r.journeys.length) { box.innerHTML = '<p class="muted">No journey found with up to 3 transfers.</p>'; return; }
  for (const j of r.journeys) {
    const d = document.createElement('div');
    d.className = 'journey';
    const mins = Math.round((j.arrive - j.depart) / 60);
    d.innerHTML = `<h3>${fmtTime(j.depart)} → ${fmtTime(j.arrive)} <small>· ${mins} min · ${j.transfers} transfer${j.transfers === 1 ? '' : 's'} · ${Math.round(j.walkSeconds / 60)} min on foot/bike</small></h3>`;
    for (const l of j.legs) {
      if (l.seconds === 0 && l.type !== 'ride') continue;
      const leg = document.createElement('div');
      leg.className = 'leg';
      const name = (s) => `<span class="name">${esc(tt.stops[s][1])}</span>`;
      if (l.type === 'ride') {
        leg.innerHTML = `<span class="t">${fmtTime(l.depart)}–${fmtTime(l.arrive)}</span><span><span class="line">${esc(routeLabel(l.route))}</span> ${esc(l.route[2])} · ${name(l.from)} → ${name(l.to)} · ${l.stops} stops</span>`;
      } else if (l.type === 'access') {
        const p = q.from.places.find((x) => x.stop === l.to);
        leg.innerHTML = `<span class="t">${fmtTime(l.depart)}</span><span>${p && p.mode === 'bike' ? '<span class="bike">bike</span>' : 'walk'} ${Math.round(l.seconds / 60)} min to ${name(l.to)}</span>`;
      } else if (l.type === 'egress') {
        const p = q.to.places.find((x) => x.stop === l.from);
        leg.innerHTML = `<span class="t">${fmtTime(l.depart)}</span><span>${p && p.mode === 'bike' ? '<span class="bike">bike</span>' : 'walk'} ${Math.round(l.seconds / 60)} min from ${name(l.from)} to the destination</span>`;
      } else {
        leg.innerHTML = `<span class="t">${fmtTime(l.depart)}</span><span>walk ${Math.round(l.seconds / 60)} min to ${name(l.to)}</span>`;
      }
      d.appendChild(leg);
    }
    box.appendChild(d);
  }
}
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

$('run').addEventListener('click', () => { const q = query(false); if (q) runQuery(q); });
for (const b of $('examples').querySelectorAll('button')) b.addEventListener('click', () => {
  if (!tt) return;
  setMode('fromMode', b.dataset.fromMode || 'walk'); setMode('toMode', b.dataset.toMode || 'walk');
  $('at').value = b.dataset.at || '08:00';
  for (const [q, inputId, selId] of [[b.dataset.from, 'fromQ', 'from'], [b.dataset.to, 'toQ', 'to']]) {
    $(inputId).value = q;
    if (parsePoint(q)) $(selId).innerHTML = '<option value="point">point on the map</option>';
    else fillOptions($(selId), searchStops(tt, q, 12));
  }
  const q = query(false); if (q) runQuery(q);
});
function setMode(segId, mode) { for (const o of $(segId).querySelectorAll('button')) o.setAttribute('aria-pressed', String(o.dataset.mode === mode)); }
$('bench').addEventListener('click', () => {
  const q = query(false); if (!q) return;
  const times = [];
  for (let i = 0; i < 5; i++) times.push(runQuery(q));
  times.sort((a, b) => a - b);
  runQuery(q, times);
});

loadAll().catch((e) => { $('loadStatus').textContent = 'Failed to load: ' + e.message; console.error(e); });
</script>
</body>
</html>
