<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayli routing test</title>
<meta name="description" content="Feasibility test: RAPTOR trip planning over the Israel GTFS timetable, entirely in the browser.">
<style>
  :root {
    --bg: #f4f5f2; --surface: #ffffff; --ink: #1b1f24; --ink-2: #5b6470; --line: #dde0da;
    --accent: #d14b1f; --accent-ink: #ffffff; --ok: #1f7a4d; --warn: #9a5b00; --chip: #eceee9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --surface: #1e2227; --ink: #e9eae6; --ink-2: #9aa2ab; --line: #2d3339;
      --accent: #e8663a; --accent-ink: #15181c; --ok: #5fc48c; --warn: #e0a84a; --chip: #262b31;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181c; --surface: #1e2227; --ink: #e9eae6; --ink-2: #9aa2ab; --line: #2d3339;
    --accent: #e8663a; --accent-ink: #15181c; --ok: #5fc48c; --warn: #e0a84a; --chip: #262b31;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
  input, select, button { font: inherit; }
  input[type=text], input[type=time], select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); }
  select { unicode-bidi: plaintext; }
  button { padding: 11px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    font-weight: 600; cursor: pointer; margin-top: 14px; }
  button.ghost { background: var(--chip); color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { display: inline-block; background: var(--chip); border-radius: 6px; padding: 4px 10px; font-size: 13px; margin: 4px 6px 0 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  .journey { border-top: 1px solid var(--line); padding: 10px 0; }
  .journey:first-child { border-top: 0; }
  .journey h3 { margin: 0 0 6px; font-size: 15px; }
  .leg { display: flex; gap: 10px; font-size: 14px; margin: 3px 0; }
  .leg .t { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 92px; }
  .line { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 6px; font-weight: 600; }
  .name { unicode-bidi: plaintext; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .error { color: var(--warn); font-size: 14px; margin-top: 8px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wayli routing test</h1>
  <p class="sub">Trip planning over the whole Israel timetable, running in this browser. Nothing is sent anywhere.</p>

  <div class="card" id="load">
    <div id="loadStatus">Loading the timetable…</div>
    <div id="loadStats"></div>
  </div>

  <div class="card">
    <label for="from">From</label>
    <input type="text" id="fromQ" placeholder="search a stop name" autocomplete="off" disabled>
    <select id="from" size="1" disabled></select>
    <label for="to">To</label>
    <input type="text" id="toQ" placeholder="search a stop name" autocomplete="off" disabled>
    <select id="to" size="1" disabled></select>
    <label for="at">Leave at</label>
    <input type="time" id="at" value="08:00" disabled>
    <div class="row">
      <button id="run" disabled>Plan trip</button>
      <button id="bench" class="ghost" disabled>Run 10× and time it</button>
    </div>
    <div class="error" id="formError" hidden>Pick both stops first.</div>
  </div>

  <div class="card" id="result" hidden>
    <div class="muted">Planning took</div>
    <div class="big" id="ms"></div>
    <div class="muted" id="verdict"></div>
    <div id="journeys"></div>
  </div>

  <p class="muted">Goal: a correct plan in under one second on a phone. Device: <span id="ua"></span></p>
</div>

<script type="module">
import { parseTimetable, searchStops, plan, fmtTime } from './raptor.js';

const $ = (id) => document.getElementById(id);
$('ua').textContent = navigator.userAgent.replace(/Mozilla\/5\.0 /, '');
const params = new URLSearchParams(location.search);
const PRESET = { from: params.get('from') || '__FROM__', to: params.get('to') || '__TO__' };
const DATA_URL = '__DATA__' === '__' + 'DATA__' ? 'timetable.bin.gz' : '__DATA__';
if (params.get('at')) $('at').value = params.get('at');

let tt = null;

async function loadTimetable() {
  const t0 = performance.now();
  const res = await fetch(DATA_URL);
  let buf, bytes;
  if (DATA_URL.endsWith('.txt')) {
    // the artifact host serves text, not binaries: base64 of the gzip'd timetable
    const b64 = await res.text();
    bytes = b64.length;
    const bin = atob(b64.trim());
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    buf = u.buffer;
  } else {
    buf = await res.arrayBuffer();
    bytes = buf.byteLength;
  }
  const tFetch = performance.now() - t0;
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) {
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([buf]).stream().pipeThrough(ds);
    buf = await new Response(stream).arrayBuffer();
  }
  const tUnzip = performance.now() - t0 - tFetch;
  const t1 = performance.now();
  tt = parseTimetable(buf);
  const tParse = performance.now() - t1;
  const c = tt.counts;
  $('loadStatus').innerHTML = `Timetable for <b>${tt.header.date.replace(/(\d{4})(\d\d)(\d\d)/, '$3.$2.$1')}</b> loaded. Whole country, every bus, train and light rail trip of that day.`;
  $('loadStats').innerHTML =
    `<span class="stat">download <b>${(bytes / 1e6).toFixed(1)} MB</b> in <b>${(tFetch / 1000).toFixed(1)} s</b></span>` +
    `<span class="stat">unzip <b>${Math.round(tUnzip)} ms</b></span>` +
    `<span class="stat">parse <b>${Math.round(tParse)} ms</b></span>` +
    `<span class="stat">stops <b>${c.stops.toLocaleString()}</b></span>` +
    `<span class="stat">trips <b>${c.trips.toLocaleString()}</b></span>` +
    `<span class="stat">stop times <b>${c.events.toLocaleString()}</b></span>` +
    `<span class="stat">in memory <b>${(buf.byteLength / 1e6).toFixed(0)} MB</b></span>`;
  for (const id of ['fromQ', 'toQ', 'from', 'to', 'at', 'run', 'bench']) $(id).disabled = false;
  fillPreset();
  const q = query(true);
  if (q) render(plan(tt, q.from, q.to, q.at, 3));
}

function fillOptions(sel, hits) {
  sel.innerHTML = '';
  for (const i of hits) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${tt.stops[i][1]} (${tt.stops[i][2] || tt.stops[i][0]})`;
    sel.appendChild(o);
  }
}
function wireSearch(inputId, selId) {
  $(inputId).addEventListener('input', () => {
    const q = $(inputId).value.trim();
    if (q.length < 2) return;
    fillOptions($(selId), searchStops(tt, q, 30));
  });
}
wireSearch('fromQ', 'from');
wireSearch('toQ', 'to');

function fillPreset() {
  for (const [q, inputId, selId] of [[PRESET.from, 'fromQ', 'from'], [PRESET.to, 'toQ', 'to']]) {
    if (!q || q.startsWith('__')) continue;
    $(inputId).value = q;
    fillOptions($(selId), searchStops(tt, q, 30));
  }
}

function render(r, runs) {
  $('result').hidden = false;
  const ms = runs ? runs : r.ms;
  $('ms').textContent = `${ms.toFixed(0)} ms`;
  $('ms').className = 'big ' + (ms < 1000 ? 'ok' : 'warn');
  $('verdict').textContent = runs
    ? `median of 10 runs (min ${r.min.toFixed(0)} ms, max ${r.max.toFixed(0)} ms), ${r.rounds} rounds`
    : `${r.rounds} rounds, ${r.journeys.length} journeys found`;
  const box = $('journeys');
  box.innerHTML = '';
  if (!r.journeys.length) { box.innerHTML = '<p class="muted">No journey found with up to 3 transfers.</p>'; return; }
  for (const j of r.journeys) {
    const d = document.createElement('div');
    d.className = 'journey';
    const mins = Math.round((j.arrive - j.depart) / 60);
    d.innerHTML = `<h3>${fmtTime(j.depart)} → ${fmtTime(j.arrive)} · ${mins} min · ${j.transfers} transfer${j.transfers === 1 ? '' : 's'}</h3>`;
    for (const l of j.legs) {
      const leg = document.createElement('div');
      leg.className = 'leg';
      if (l.type === 'walk') {
        leg.innerHTML = `<span class="t">${fmtTime(l.depart)}</span><span>walk ${Math.round(l.seconds / 60)} min to <span class="name">${esc(tt.stops[l.to][1])}</span></span>`;
      } else {
        leg.innerHTML = `<span class="t">${fmtTime(l.depart)}–${fmtTime(l.arrive)}</span><span><span class="line">${esc(l.route[0] || (l.route[3] === 2 ? "Train" : l.route[1]))}</span> ${esc(l.route[2])} · <span class="name">${esc(tt.stops[l.from][1])}</span> → <span class="name">${esc(tt.stops[l.to][1])}</span> · ${l.stops} stops</span>`;
      }
      d.appendChild(leg);
    }
    box.appendChild(d);
  }
}
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function query(quiet) {
  const from = $('from').value === '' ? NaN : Number($('from').value);
  const to = $('to').value === '' ? NaN : Number($('to').value);
  const [h, m] = $('at').value.split(':').map(Number);
  const bad = Number.isNaN(from) || Number.isNaN(to) || Number.isNaN(h);
  $('formError').hidden = quiet || !bad;
  return bad ? null : { from, to, at: h * 3600 + m * 60 };
}
$('run').addEventListener('click', () => {
  const q = query(); if (!q) return;
  render(plan(tt, q.from, q.to, q.at, 3));
});
$('bench').addEventListener('click', () => {
  const q = query(); if (!q) return;
  const times = [];
  let r;
  for (let i = 0; i < 10; i++) { r = plan(tt, q.from, q.to, q.at, 3); times.push(r.ms); }
  times.sort((a, b) => a - b);
  render({ ...r, min: times[0], max: times[9] }, times[5]);
});

loadTimetable().catch((e) => { $('loadStatus').textContent = 'Failed to load the timetable: ' + e.message; console.error(e); });
</script>
</body>
</html>
