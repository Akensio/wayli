<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d14b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wayli">
<title>Wayli</title>
<meta name="description" content="תחבורה ציבורית בישראל: אוטובוס, רכבת, רכבת קלה ואופניים, מתוכנן בטלפון שלך.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1><img src="icons/icon-192.png" alt=""> Wayli</h1>
  <span class="spacer"></span>
  <button type="button" class="lang" id="langBtn">EN</button>
</header>
<main>
  <div class="status" id="status"><span id="statusText">טוען…</span><div class="bar" id="statusBar"><div></div></div></div>

  <section class="screen" id="screen-plan">
    <div class="card">
      <div class="field">
        <span class="icon">●</span>
        <input type="text" id="fromQ" placeholder="מאיפה?" autocomplete="off" enterkeyhint="search">
        <button type="button" class="loc" id="fromLoc">המיקום שלי</button>
        <div class="dropdown" id="fromDrop" hidden></div>
      </div>
      <div class="field">
        <span class="icon">■</span>
        <input type="text" id="toQ" placeholder="לאן?" autocomplete="off" enterkeyhint="search">
        <button type="button" class="loc" id="toLoc">המיקום שלי</button>
        <div class="dropdown" id="toDrop" hidden></div>
      </div>
      <div class="row">
        <button type="button" class="swap" id="swap">⇅ <span data-t="swap">החלף</span></button>
        <select id="day"></select>
        <input type="time" id="at">
        <button type="button" class="swap" id="nowBtn" data-t="now">עכשיו</button>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="muted" data-t="bike">אופניים</span>
        <div class="seg" id="bikeMode">
          <button type="button" data-mode="none" aria-pressed="true" data-t="bikeNone">בלי</button>
          <button type="button" data-mode="park" aria-pressed="false" data-t="bikePark">עד התחנה</button>
          <button type="button" data-mode="along" aria-pressed="false" data-t="bikeAlong">לוקח/ת איתי</button>
        </div>
        <label class="check"><input type="checkbox" id="folding"> <span data-t="folding">מתקפלים</span></label>
      </div>
      <button type="button" class="primary" id="planBtn" data-t="plan">תכנון מסלול</button>
      <div class="error-box" id="planError" hidden></div>
    </div>
    <div id="results"></div>
  </section>

  <section class="screen" id="screen-nearby" hidden>
    <div class="row" style="margin-bottom:8px">
      <h2 class="sec" style="margin:0" data-t="nearbyTitle">תחנות בקרבתי</h2>
      <span class="spacer" style="flex:1"></span>
      <button type="button" class="ghost" id="nearbyRefresh" data-t="refresh">רענון</button>
    </div>
    <div id="nearbyList" class="stops-list"><div class="empty" data-t="nearbyEmpty">לחצו על רענון כדי למצוא תחנות ליד המיקום שלכם.</div></div>
  </section>

  <section class="screen" id="screen-fav" hidden>
    <h2 class="sec" data-t="favTrips">מסלולים שמורים</h2>
    <div id="favTrips"></div>
    <h2 class="sec" data-t="favStops">תחנות שמורות</h2>
    <div id="favStops" class="stops-list"></div>
  </section>

  <section class="screen" id="screen-about" hidden>
    <div class="card" id="aboutBox"></div>
  </section>
</main>
<nav class="tabs" role="tablist">
  <button type="button" role="tab" data-screen="plan" aria-selected="true"><span class="ic">🧭</span><span data-t="tabPlan">מסלול</span></button>
  <button type="button" role="tab" data-screen="nearby" aria-selected="false"><span class="ic">📍</span><span data-t="tabNearby">בקרבתי</span></button>
  <button type="button" role="tab" data-screen="fav" aria-selected="false"><span class="ic">★</span><span data-t="tabFav">מועדפים</span></button>
  <button type="button" role="tab" data-screen="about" aria-selected="false"><span class="ic">ⓘ</span><span data-t="tabAbout">אודות</span></button>
</nav>

<div class="detail" id="detail" hidden>
  <div class="bar">
    <button type="button" class="ghost" id="detailBack" data-t="back">חזרה</button>
    <h2 id="detailTitle"></h2>
    <button type="button" class="star" id="detailStar" title="שמירה">☆</button>
  </div>
  <div class="body">
    <div id="map"></div>
    <div class="legs" id="detailLegs"></div>
  </div>
</div>

<div class="detail" id="stopDetail" hidden>
  <div class="bar">
    <button type="button" class="ghost" id="stopBack" data-t="back">חזרה</button>
    <h2 id="stopTitle"></h2>
    <button type="button" class="star" id="stopStar" title="שמירה">☆</button>
  </div>
  <div class="body">
    <div class="legs">
      <div class="muted" id="stopMeta"></div>
      <div class="row" style="margin:8px 0">
        <button type="button" class="ghost" id="stopFrom" data-t="fromHere">מכאן</button>
        <button type="button" class="ghost" id="stopTo" data-t="toHere">לכאן</button>
      </div>
      <h2 class="sec" data-t="nextDeps">היציאות הבאות</h2>
      <div id="stopDeps"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script type="module" src="app.js"></script>
</body>
</html>
