# Nightly data build and GitHub Pages deploy. Enables Pages (source: GitHub Actions) by itself on the first run.
name: Build and deploy
on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC, after the Ministry's nightly feed update
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run: # new train and bus section times go out as soon as they are learned
    workflows: ['Train section times', 'Bus section times']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turn on GitHub Pages for this repository if it is not on yet
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint and type-check, then build the app with Vite into dist/
        run: npm run check && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy osmium pillow duckdb pyproj # pillow (HPND): the elevation tiles' PNGs; duckdb (MIT): Overture's places; pyproj (MIT): the Survey of Israel's grid
      - name: The pipeline's own checks (the stop-on-course rule; which street an address joins)
        run: python3 -I pipeline/test_projection.py && python3 -I pipeline/test_places.py && python3 -I pipeline/test_entrances.py
      - name: The first service day (until 03:00 the night belongs to the previous date)
        id: day
        run: echo "start=$(TZ=Asia/Jerusalem date -d '-3 hours' +%Y%m%d)" >> "$GITHUB_OUTPUT"
      # the last feed that downloaded, kept a day at a time: when the Ministry's server does not answer (it does not, at
      # times, for hours), the build goes on with it instead of failing, so an app change still deploys
      - name: Cache the last good GTFS feed
        uses: actions/cache@v4
        with:
          path: data/gtfs-last.zip
          key: gtfs-${{ steps.day.outputs.start }}
          restore-keys: gtfs-
      - name: Download the GTFS feed
        run: |
          mkdir -p data/osm
          # the Ministry's server resets connections now and then: retry, and insist on a real zip
          for i in 1 2 3; do
            curl -fsSL --connect-timeout 60 -o data/gtfs.zip https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip && [ "$(stat -c %s data/gtfs.zip)" -gt 20000000 ] && break
            echo "download failed (try $i)"; rm -f data/gtfs.zip; sleep 30
          done
          if [ -f data/gtfs.zip ]; then cp data/gtfs.zip data/gtfs-last.zip
          elif [ -f data/gtfs-last.zip ]; then echo "::warning::the Ministry's server did not answer: building with the last feed that downloaded"; cp data/gtfs-last.zip data/gtfs.zip
          else exit 1; fi
      # the weekend lines no feed carries (pipeline/weekend.py), from Tel Aviv's GIS server; its last answer is kept for
      # the times it does not answer
      - name: Cache the weekend lines' last answer
        uses: actions/cache@v4
        with:
          path: data/weekend.json
          key: weekend-${{ github.run_id }}
          restore-keys: weekend-
      - name: Weekend lines, with estimated times, into the feed
        run: python3 -I pipeline/weekend.py data/gtfs.zip --cache data/weekend.json || echo "::warning::no weekend lines this time"
      - name: Cache the OpenStreetMap extract, Overture's places, street graph and address book (rebuilt weekly)
        id: osm
        uses: actions/cache@v4
        with:
          path: |
            data/osm/israel-and-palestine-latest.osm.pbf
            data/streets.bin.gz
            data/places.bin.gz
            data/overture.json.gz
            data/public.json.gz
            data/entrances.json
            data/rail.bin.gz
            data/dem
          key: osm-${{ github.run_id }}
          restore-keys: osm-
      - name: Street graph, address book and rail graph
        run: |
          if [ ! -f data/streets.bin.gz ] || [ ! -f data/places.bin.gz ] || [ ! -f data/rail.bin.gz ] || [ ! -f data/entrances.json ] || [ -n "$(find data/streets.bin.gz -mtime +6)" ] \
             || ! python3 -I pipeline/places.py --check data/places.bin.gz \
             || ! python3 -I pipeline/entrances.py --check data/entrances.json \
             || ! python3 -I pipeline/streets.py --check --out data/streets.bin.gz; then   # an older format is rebuilt too
            # a mirror may answer with an error page instead of the extract: fail on HTTP errors and insist on a real file
            dl() { curl -fsSL --retry 3 --retry-delay 15 -o "$1" "$2" && [ "$(stat -c %s "$1")" -gt 50000000 ]; }
            dl data/osm/israel-and-palestine-latest.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf \
              || dl data/osm/israel-and-palestine-latest.osm.pbf https://download.openstreetmap.fr/extracts/asia/israel_and_palestine-latest.osm.pbf
            python3 -I pipeline/elevation.py --fetch data/dem   # the ground's heights, for climbs (kept in the cache)
            python3 -I pipeline/streets.py data/osm/israel-and-palestine-latest.osm.pbf --dem data/dem --out data/streets.bin.gz
            # Overture's everyday places; when its bucket does not answer, the last week's file (kept in the cache) serves
            python3 -I pipeline/overture.py --out data/overture.new.json.gz && mv data/overture.new.json.gz data/overture.json.gz \
              || echo "Overture unreachable: using the previous file" >&2
            # public bodies' businesses and institutions (Tel Aviv's GIS, data.gov.il); the same fallback
            python3 -I pipeline/public.py --out data/public.new.json.gz && mv data/public.new.json.gz data/public.json.gz \
              || echo "public sources unreachable: using the previous file" >&2
            python3 -I pipeline/places.py data/osm/israel-and-palestine-latest.osm.pbf --gtfs data/gtfs.zip \
              $( [ -f data/overture.json.gz ] && echo --overture data/overture.json.gz ) \
              $( [ -f data/public.json.gz ] && echo --public data/public.json.gz ) --out data/places.bin.gz
            python3 -I pipeline/rail.py data/osm/israel-and-palestine-latest.osm.pbf --out data/rail.bin.gz
            # station entrances (OpenStreetMap, tied to the feed's rail stops); the previous file serves if this fails
            python3 -I pipeline/entrances.py data/osm/israel-and-palestine-latest.osm.pbf --out data/entrances.new.json \
              && mv data/entrances.new.json data/entrances.json || echo "entrances not built: using the previous file" >&2
          fi
      # The compiled days depend only on the feed, the graphs and the compiler: an app-only push reuses them.
      - name: Cache the compiled timetables and courses (reused while the feed, the graphs and the compiler are unchanged)
        id: tt
        uses: actions/cache@v4
        with:
          path: |
            data/timetable-*.bin.gz
            data/shapes.bin.gz
          key: tt-${{ steps.day.outputs.start }}-${{ hashFiles('data/gtfs.zip', 'data/streets.bin.gz', 'data/rail.bin.gz', 'pipeline/compile.py', 'pipeline/shapes.py', 'pipeline/rail.py', 'pipeline/streetgraph.py', 'pipeline/container.py', 'pipeline/common.py') }}
      - name: Vehicle courses (shapes)
        if: steps.tt.outputs.cache-hit != 'true'
        run: python3 -I pipeline/shapes.py data/gtfs.zip --out data/shapes.bin.gz
      - name: Timetable, the next 7 days
        if: steps.tt.outputs.cache-hit != 'true'
        run: |
          # the service day: until 03:00 the night still belongs to the previous date; the days compile four at a time
          for i in 0 1 2 3 4 5 6; do TZ=Asia/Jerusalem date -d "-3 hours +$i day" +%Y%m%d; done \
            | xargs -P 4 -I{} sh -c 'python3 -I pipeline/compile.py data/gtfs.zip --date {} --streets data/streets.bin.gz --shapes data/shapes.bin.gz --rail data/rail.bin.gz --out data/timetable-{}.bin.gz > data/compile-{}.log 2>&1 || { cat data/compile-{}.log; exit 1; }'
          for i in 0 1 2 3 4 5 6; do d=$(TZ=Asia/Jerusalem date -d "-3 hours +$i day" +%Y%m%d); [ -s "data/timetable-$d.bin.gz" ] || { echo "missing timetable-$d"; exit 1; }; done
      - name: The newest learned train section times (.github/workflows/railtimes.yml), if any
        uses: actions/cache/restore@v4
        with:
          path: data/railtimes.json
          key: railtimes-none
          restore-keys: railtimes-
      - name: The newest learned bus section times (.github/workflows/bustimes.yml), if any
        uses: actions/cache/restore@v4
        with:
          path: data/bustimes.bin.gz
          key: bustimes-none
          restore-keys: bustimes-
      # the search catalogues: the address book, and every day's stops, indexed by the app's own code (a few seconds)
      - name: Search catalogues
        run: node pipeline/searchindex.ts data/places.bin.gz data/timetable-*.bin.gz --out data/search.bin.gz --stops data/searchstops.bin.gz
      - run: python3 pipeline/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
