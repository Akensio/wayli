# Nightly data build and GitHub Pages deploy. Enables Pages (source: GitHub Actions) by itself on the first run.
name: Build and deploy
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC, after the Ministry's nightly feed update
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turn on GitHub Pages for this repository if it is not on yet
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy osmium
      - name: Download the GTFS feed
        run: |
          mkdir -p data/osm
          curl -sSL -o data/gtfs.zip https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip
      - name: Cache the OpenStreetMap extract, street graph and address book (rebuilt weekly)
        id: osm
        uses: actions/cache@v4
        with:
          path: |
            data/osm/israel-and-palestine-latest.osm.pbf
            data/streets.bin.gz
            data/places.bin.gz
            data/rail.bin.gz
          key: osm-${{ github.run_id }}
          restore-keys: osm-
      - name: Street graph, address book and rail graph
        run: |
          if [ ! -f data/streets.bin.gz ] || [ ! -f data/places.bin.gz ] || [ ! -f data/rail.bin.gz ] || [ -n "$(find data/streets.bin.gz -mtime +6)" ]; then
            # a mirror may answer with an error page instead of the extract: fail on HTTP errors and insist on a real file
            dl() { curl -fsSL --retry 3 --retry-delay 15 -o "$1" "$2" && [ "$(stat -c %s "$1")" -gt 50000000 ]; }
            dl data/osm/israel-and-palestine-latest.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf \
              || dl data/osm/israel-and-palestine-latest.osm.pbf https://download.openstreetmap.fr/extracts/asia/israel_and_palestine-latest.osm.pbf
            python3 -I pipeline/streets.py data/osm/israel-and-palestine-latest.osm.pbf --out data/streets.bin.gz
            python3 -I pipeline/places.py data/osm/israel-and-palestine-latest.osm.pbf --gtfs data/gtfs.zip --out data/places.bin.gz
            python3 -I pipeline/rail.py data/osm/israel-and-palestine-latest.osm.pbf --out data/rail.bin.gz
          fi
      - name: Vehicle courses (shapes)
        run: python3 -I pipeline/shapes.py data/gtfs.zip --out data/shapes.bin.gz
      - name: Timetable, the next 7 days
        run: |
          for i in 0 1 2 3 4 5 6; do
            # the service day: until 03:00 the night still belongs to the previous date
            d=$(TZ=Asia/Jerusalem date -d "-3 hours +$i day" +%Y%m%d)
            python3 -I pipeline/compile.py data/gtfs.zip --date "$d" --streets data/streets.bin.gz --shapes data/shapes.bin.gz --rail data/rail.bin.gz --out "data/timetable-$d.bin.gz"
          done
      - run: python3 pipeline/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
